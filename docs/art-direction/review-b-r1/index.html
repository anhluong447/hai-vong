<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><link rel="stylesheet" href="/styles/tokens.css"><link rel="stylesheet" href="review.css"><script type="module" src="review.js"></script></head>
<body><main data-review><header><h1 data-key="review.c1.title"></h1><p data-key="review.c1.description"></p><p data-role="status" aria-live="polite"></p></header>
<section class="toolbar"><label><span data-role="position-label"></span><input type="range" data-role="position"></label><div data-role="positions"></div><button data-action="reset" data-key="review.c1.reset"></button></section>
<section class="toolbar"><label><input type="checkbox" data-role="guides"><span data-key="review.c1.guides"></span></label><label><input type="checkbox" data-role="shadows" checked><span data-key="review.c1.shadows"></span></label><output data-role="stats"></output></section>
<div class="stage" data-role="stage"><canvas tabindex="0"></canvas></div>
<fieldset><legend data-key="review.c1.props"></legend><div class="toolbar" data-role="props"></div></fieldset>
</main></body></html>
