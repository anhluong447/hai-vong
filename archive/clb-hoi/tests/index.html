<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tests</title>
  <style>
    :root { --bg: #0d0f14; --fg: #e8e4da; --ok: #6fcf8f; --bad: #ef6b62; --muted: #8a8577; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-monospace, Consolas, monospace; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    .ok { color: var(--ok); } .bad { color: var(--bad); } .muted { color: var(--muted); }
    pre { white-space: pre-wrap; margin: 4px 0 12px 24px; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Câu Lạc Bộ Hỏi — test suite</h1>
  <div id="out" class="muted">Running…</div>
  <script type="module">
    import { runAll } from './all.js';
    const loadText = async (path) => {
      const response = await fetch(new URL(`../content/${path}`, location.href), { cache: 'no-cache' });
      if (!response.ok) throw new Error(`${path}: ${response.status}`);
      return response.text();
    };
    const results = await runAll({ loadText });
    const out = document.getElementById('out');
    out.className = '';
    out.replaceChildren(...results.flatMap((r) => {
      const line = document.createElement('div');
      line.className = r.ok ? 'ok' : 'bad';
      line.textContent = `${r.ok ? '✓' : '✗'} ${r.name}  (${r.ms}ms)`;
      if (r.ok) return [line];
      const pre = document.createElement('pre');
      pre.textContent = r.error?.stack ?? String(r.error);
      return [line, pre];
    }));
    const failed = results.filter((r) => !r.ok).length;
    const summary = document.createElement('p');
    summary.className = failed ? 'bad' : 'ok';
    summary.textContent = `${results.length - failed}/${results.length} passed`;
    out.append(summary);
    document.title = failed ? `✗ ${failed} failed` : '✓ all passed';
  </script>
</body>
</html>
