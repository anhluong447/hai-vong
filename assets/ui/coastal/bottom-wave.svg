  <!-- Foam highlight crest strokes -->
  <path d="M 0 109 C 200 79 460 124 720 94 C 980 64 1220 114 1460 84 C 1570 69 1620 89 1672 99" fill="none" stroke="#e6f7f5" stroke-width="1.8" opacity="0.75"/>
</svg>
