<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941">
  <!-- Alpha mask for the existing newspaper art. Excludes baked key hints. -->
  <!-- Cover the already-blurred art edge with solid alpha; feather outside it.
