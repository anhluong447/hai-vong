<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>World authoring tests</title></head><body><div id="results"></div><script type="module">
import './world-scenes.test.js';import './world-coordinates.test.js';import './world-editor.test.js';
import './world-assets.test.js';

import {runAll} from './harness.js';const root=document.querySelector('#results'),results=await runAll({onProgress:name=>root.textContent=name});root.replaceChildren();
