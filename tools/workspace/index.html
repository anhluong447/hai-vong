<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><link rel="stylesheet" href="/tools/workspace/workspace.css"><script type="module" src="/tools/workspace/boot.js"></script></head>
<body data-project="/content/project.json" data-workspace>
<header><h1 data-text="workspace.title"></h1><p data-role="mode"></p></header>
<main>
<nav data-role="explorer" data-label="workspace.explorer"></nav>
<section><h2 data-role="document-name"></h2>
<div class="toolbar"><button data-action="undo" data-text="workspace.undo"></button><button data-action="redo" data-text="workspace.redo"></button><button data-action="save" data-text="authoring.saveGroup"></button><button data-action="recover" data-text="workspace.recover"></button></div>
<p data-role="status" aria-live="polite"></p><div data-role="diagnostics" aria-live="polite"></div><section data-role="resource-tools" data-label="authoring.title"></section>
<details data-role="raw-source"><summary data-text="workspace.source"></summary><label for="source" data-text="workspace.source"></label><textarea id="source" data-role="source" spellcheck="false"></textarea><button data-action="apply" data-text="workspace.apply"></button></details></section>
<section><h2 data-text="workspace.preview"></h2><div class="toolbar"><button data-action="preview" data-text="workspace.start"></button><button data-action="stop" data-text="workspace.stop"></button></div><p data-role="dialogue"></p><div data-role="choices"></div><button data-action="advance" data-text="workspace.advance"></button></section>
</main></body></html>
