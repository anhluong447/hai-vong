<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khuê · bốn hướng animation</title><link rel="stylesheet" href="../styles/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#e7efed;font:18px/1.6 'Be Vietnam Pro',sans-serif}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:28px;margin:0}h2{font-size:21px;margin:8px 0}p{margin:8px 0}a{color:#a5d6c2}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:16px 0}button,select{font:inherit;background:#263b4b;color:#f3e9d1;border:1px solid #789080;border-radius:6px;padding:6px 12px}label{display:flex;gap:8px;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#1c2938;padding:12px;border-radius:10px;overflow:hidden}.card p{font-size:15px;color:#bed0cd}canvas,img{image-rendering:pixelated;max-width:100%;height:auto}canvas{display:block;margin:auto}.strip{overflow:auto}.strip canvas{max-width:none;margin:0}#sheet{width:512px}#status{color:#e4ca89}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){main{padding:14px}.cards{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Khuê · bốn hướng animation</h1><p>Cùng pha bước, cùng pivot và kích thước. Xem độ co–duỗi chân, độ dày tay/chân và nhịp đánh tay khi đổi hướng.</p>
<div class="controls"><label>Clip <select id="clip"><option value="walk">Đi bộ</option><option value="idle">Đứng</option><option value="talk">Nói chuyện</option></select></label><label>Tốc độ <select id="speed"><option value="0.25">0,25×</option><option value="0.5">0,5×</option><option value="1" selected>1×</option></select></label><button id="play">Tạm dừng</button><button id="previous">← Frame</button><button id="next">Frame →</button><label><input type="checkbox" id="onion"> Onion skin</label></div>
<p id="status">Đang tải…</p><div class="cards" id="cards"></div>
<h2 id="sheet-title">Sheet trong game · 64 frame</h2><a id="download" download="khue.png"><img id="sheet" alt="Sheet đầy đủ Khuê, walk idle talk bốn hướng"></a>
<p><a href="../pixel.html">Vào game →</a> · <a href="sprite-lab.html">So với Vân</a> · <a href="khue-proportion-audit.html">So tỉ lệ đứng/đi</a></p>
</main><script type="module">
import {clipFrame} from '../src/pixel/animation.js?v=pilot-2';
const $=id=>document.getElementById(id),directions=['down','left','right','up'],labels={down:'Nhìn xuống',left:'Nhìn trái',right:'Nhìn phải',up:'Nhìn lên'};
try{
const atlas=await(await fetch('../assets/pixel/atlas.json')).json(),s={...atlas.characters.overrides.khue};if(new URLSearchParams(location.search).get('candidate')==='v5'){s.file='pilot-v5/khue.png';$('sheet-title').textContent='Bản thử theo storyboard · 64 frame';}
const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src='../assets/pixel/'+s.file});
$('sheet').src=image.src;$('download').href=image.src;
$('cards').innerHTML=directions.map(dir=>`<section class="card"><h2>${labels[dir]}</h2><canvas id="${dir}" width="240" height="240"></canvas><p id="${dir}-info"></p><div class="strip"><canvas id="${dir}-strip" width="512" height="96"></canvas></div></section>`).join('');
const frameQuery=new URLSearchParams(location.search);let playing=!frameQuery.has('frame'),elapsed=0,last=performance.now(),manual=Math.max(0,Math.min(7,Number(frameQuery.get('frame'))||0));const visited=new Set();$('play').textContent=playing?'Tạm dừng':'Phát loop';
const selected=()=>clipFrame(s,$('clip').value,'down',elapsed,elapsed*16/180).index;
function draw(){const clip=s.clips[$('clip').value],index=playing?selected():manual;for(const dir of directions){const row=clip.rows[s.directions.indexOf(dir)],canvas=$(dir),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#566d57';ctx.fillRect(0,0,240,240);ctx.fillStyle='#738667';for(let x=0;x<240;x+=32){ctx.fillRect(x,220,2,20)}if($('onion').checked){ctx.globalAlpha=.25;ctx.drawImage(image,clip.columns[(index+clip.columns.length-1)%clip.columns.length]*32,row*48,32,48,56,24,128,192);ctx.globalAlpha=1}ctx.drawImage(image,clip.columns[index]*32,row*48,32,48,56,24,128,192);$(dir+'-info').textContent=`${$('clip').value} · ${index+1}/${clip.columns.length} · 32×48`;
const sc=$(dir+'-strip').getContext('2d');sc.imageSmoothingEnabled=false;sc.clearRect(0,0,512,96);for(let i=0;i<clip.columns.length;i++){sc.fillStyle=i===index?'#426358':'#152433';sc.fillRect(i*64,0,64,96);sc.drawImage(image,clip.columns[i]*32,row*48,32,48,i*64,0,64,96)}}
if(playing&&$('clip').value==='walk')visited.add(index);$('status').textContent=`Đã tải ${s.file} · walk đã phát ${visited.size}/8 pha ở cả bốn hướng.`;}
$('play').onclick=()=>{if(playing)manual=selected();else{const c=s.clips[$('clip').value];elapsed=c.stridePixels?manual/c.columns.length*c.stridePixels*180/16:(c.durations||c.columns.map(()=>c.frameMs||100)).slice(0,manual).reduce((sum,n)=>sum+n,0)}playing=!playing;last=performance.now();$('play').textContent=playing?'Tạm dừng':'Phát loop';draw()};
function step(delta){if(playing)manual=selected();playing=false;$('play').textContent='Phát loop';manual=(manual+delta+s.clips[$('clip').value].columns.length)%s.clips[$('clip').value].columns.length;draw()}
$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('clip').onchange=()=>{elapsed=0;manual=0;draw()};$('speed').onchange=draw;$('onion').onchange=draw;
setInterval(()=>{const now=performance.now();if(playing)elapsed+=Math.min(100,now-last)*Number($('speed').value);last=now;draw()},33);draw();window.khueAnimationLab=Object.freeze({ready:true,get playing(){return playing},get clip(){return $('clip').value},get visitedFrames(){return [...visited]}});
}catch(error){$('status').textContent='Không tải được: '+error.message;window.khueAnimationLab={ready:false,error:String(error)}}
</script></body></html>
