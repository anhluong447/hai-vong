<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-text="ui.coastal.hud.preview.title"></title>
  <link rel="stylesheet" href="../styles/replica.css">
  <link rel="stylesheet" href="../styles/coastal.css">
  <style>
    body {
      background: #091c24;
      color: #e8ede9;
    }
    .replica-authoring {
      background: #0f2732;
      border-bottom: 1px solid rgba(98, 214, 208, 0.25);
      color: #e8ede9;
      padding: 16px 32px;
    }
    .replica-authoring h1 {
      color: #ffffff;
      font-family: var(--sea-display);
      font-size: 24px;
      letter-spacing: 0.04em;
    }
    .replica-authoring p {
      color: #8faeb7;
      font-size: 14px;
    }
    .replica-controls {
      margin-top: 12px;
      gap: 14px;
    }
    .replica-controls select,
    .replica-controls input,
    .replica-controls button {
      background: #091c24;
      color: #e8ede9;
      border: 1px solid #1c4b58;
      border-radius: 3px;
      padding: 6px 10px;
    }
    .replica-controls button:hover {
      background: #143e4c;
      border-color: #62d6d0;
      color: #ffffff;
    }
    .hud-preview-stage {
      position: relative;
      width: 1672px;
      height: 941px;
      max-width: calc(100vw - 48px);
      max-height: calc((100vw - 48px) * 941 / 1672);
      aspect-ratio: 1672 / 941;
      margin: 20px auto;
      overflow: hidden;
      background: #063c4b;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      border-radius: 2px;
    }
    .hud-preview-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .hud-preview-bg.dark {
      background: radial-gradient(circle at center, #0a3340 0%, #031c24 100%);
    }
    .hud-preview-bg.light {
      background: #f4f1e7;
    }
    .hud-preview-status {
      padding: 12px 24px;
      font-size: 13px;
      color: #92b8bf;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .hud-preview-status strong {
      color: #ffffff;
    }
    .hud-click-hint {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 60, 75, 0.75);
      color: #bce7e3;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 12px;
      pointer-events: none;
      border: 1px solid rgba(98, 214, 208, 0.3);
    }
  </style>
</head>
<body class="coastal-app">
  <header class="replica-authoring">
    <h1 data-text="ui.coastal.hud.preview.heading"></h1>
    <p data-text="ui.coastal.hud.preview.note"></p>
    <div class="replica-controls">
      <label>
        <span data-text="ui.coastal.hud.preview.toggle_bg"></span>
        <select id="bg-mode">
          <option value="reference">03-hud-map.png (Concept)</option>
          <option value="dark">Dark Canvas</option>
          <option value="light">Light Canvas</option>
        </select>
      </label>
      <label>
        <span data-text="ui.coastal.hud.preview.energy"></span>
        <input id="energy-range" type="range" min="0" max="4" value="3">
      </label>
      <label>
        <span data-text="ui.coastal.hud.preview.money"></span>
        <input id="money-input" type="number" step="50" min="0" value="450" style="width:80px">
      </label>
      <button id="btn-next-day" type="button" data-text="ui.coastal.hud.preview.next_day"></button>
      <button id="btn-next-phase" type="button" data-text="ui.coastal.hud.preview.next_phase"></button>
      <button id="btn-toggle-prompt" type="button" data-text="ui.coastal.hud.preview.toggle_prompt"></button>
      <label>
        <select id="prompt-target"></select>
      </label>
      <label>
        <input id="chk-reduced-motion" type="checkbox">
        <span data-text="ui.coastal.hud.preview.reduced_motion"></span>
      </label>
      <a href="../pixel.html" style="color:#62d6d0;margin-left:auto;text-decoration:none;" data-text="ui.coastal.hud.preview.back"></a>
    </div>
  </header>

  <main>
    <div id="stage-host" class="hud-preview-stage">
      <img id="ref-image" class="hud-preview-bg" src="../docs/ui-concepts/coastal-editorial-v1/03-hud-map.png" alt="Concept reference">
      <div id="bg-fill" class="hud-preview-bg" hidden></div>
      <div class="hud-click-hint">Click onto stage to move the interaction prompt</div>
    </div>
    <div class="hud-preview-status">
      <span>Day: <strong id="status-day">THỨ NĂM</strong></span>
      <span>Phase: <strong id="status-phase">Chiều · Phòng CLB</strong></span>
      <span>Energy: <strong id="status-energy">3 / 4</strong></span>
      <span>Money: <strong id="status-money">450đ</strong></span>
      <span>Location: <strong id="status-location">TÒA SOẠN HỒI ÂM</strong></span>
    </div>
  </main>

  <script type="module" src="coastal-hud-preview.js"></script>
</body>
</html>
