<!doctype html><html><head><meta charset="utf-8"><title>Loading interaction preview</title><style>body{margin:0;background:#0c1320}iframe{display:block;border:0;width:100%;height:100vh}iframe.mobile{width:390px;height:844px;margin:auto}</style></head><body><iframe id="game" src="../interaction.html"></iframe><script type="module">
import {MAPS,findPath,pathToObject} from '../src/pixel/maps.js';
window.addEventListener('unhandledrejection',e=>document.title=`Preview error: ${e.reason?.message||e.reason}`);
const params=new URLSearchParams(location.search),frame=document.getElementById('game');if(params.has('mobile'))frame.className='mobile';
const wait=fn=>new Promise((resolve,reject)=>{const start=Date.now();const poll=()=>{if(fn())resolve();else if(Date.now()-start>15000)reject(new Error('Preview timeout'));else setTimeout(poll,25);};poll();});
await wait(()=>frame.contentWindow.pressInteraction?.ready);const w=frame.contentWindow,d=w.document,api=w.pressInteraction,canvas=d.querySelector('canvas'),map=MAPS.interaction;
const point=(x,y)=>{const p=api.screenPosition(x,y),r=canvas.getBoundingClientRect();canvas.dispatchEvent(new w.PointerEvent('pointerdown',{clientX:r.left+p.x,clientY:r.top+p.y,bubbles:true}));};
if(!params.has('room')){
 const id=params.get('character')||'nhi',target=[...map.objects,...map.npcs].find(o=>o.scene===id);if(!target)throw new Error('Unknown preview actor');
 const edge=pathToObject(map,api.world,target,map.npcs).at(-1);
 if(edge)for(let guard=0;guard<60;guard++){if(api.world.x===edge.x&&api.world.y===edge.y&&!api.moving)break;const path=findPath(map,api.world,edge,map.npcs),rect=canvas.getBoundingClientRect();const p=path.filter(n=>{const s=api.screenPosition(n.x,n.y);return s.x>8&&s.y>8&&s.x<rect.width-8&&s.y<rect.height-8;}).at(-1);point(p.x,p.y);await wait(()=>!api.moving&&api.world.x===p.x&&api.world.y===p.y);}
 point(target.x,target.y);await wait(()=>api.dialogue);
 const expression=params.get('expression')||'happy';for(let guard=0;guard<12;guard++){const node=api.dialogue;if(node.speaker===id&&node.expression===expression)break;const label=node.choices?.[0].label||(node.next?'Tiếp tục →':null);if(!label)break;[...d.querySelectorAll('button')].find(b=>b.textContent===label).click();}
 await wait(()=>api.sprite.node.dataset.status==='ready'&&api.sprite.node.dataset.speaker===api.dialogue.speaker&&api.sprite.node.dataset.expression===api.dialogue.expression);
}
await d.fonts.ready;for(const animation of d.getAnimations())if(animation.effect?.target?.closest('.dialogue-stage'))animation.finish();document.title=d.documentElement.scrollWidth>w.innerWidth+1?'Preview overflow':'Interaction preview ready';
</script></body></html>
