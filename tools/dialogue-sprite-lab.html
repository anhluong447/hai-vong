<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hồi Âm · Dialogue art lab</title>
<link rel="stylesheet" href="../styles/main.css"><link rel="stylesheet" href="../styles/gameplay.css"><link rel="stylesheet" href="../styles/press-ui.css"><link rel="stylesheet" href="../styles/pixel.css"><link rel="stylesheet" href="../styles/dialogue-sprites.css">
<style>body{margin:0}body.pixel-app{background:#0c1320;color:#f8f5ef;min-height:100vh}.lab-shell{max-width:1280px;margin:auto;padding:24px}.lab-controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:20px 0}.lab-controls label{display:flex;gap:8px;align-items:center}.art-preview{height:700px;max-height:82vh;min-height:490px;display:flex;align-items:flex-end;justify-content:center;padding:28px;background:linear-gradient(#344841,#172e2b);border:1px solid #ffffff30;overflow:hidden}.art-preview.light{background:#e9dfc9}.art-preview.dark{background:#101522}.art-preview.mobile{width:390px;max-width:100%;padding:12px;margin:auto}.art-preview.mobile .dialogue-stage .pixel-dialog{padding:18px;max-height:360px}.art-preview.mobile .dialogue-sprite{left:auto;right:0;bottom:calc(100% - 18px);width:150px;height:230px;z-index:2}.art-preview.mobile .pixel-dialog{z-index:1}.art-preview.mobile .dialogue-line{padding-right:0;font-size:18px}.art-preview.mobile .pixel-dialog-head{align-items:flex-start;gap:8px}.art-preview.mobile .pixel-dialog-head h2{font-size:20px}.art-preview.mobile .pixel-dialog-head button{font-size:14px;flex:none;padding:8px}.lab-note{color:#b8c8cf;font-size:16px}#art-status{min-height:28px}@media(max-width:700px){.lab-shell{padding:14px}.art-preview{padding:12px}.lab-controls label{flex-wrap:wrap}}.cast-review{margin-top:30px}.cast-review-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}.cast-review-grid article{min-width:0;background:#18212c;padding:14px;border:1px solid #ffffff25}.cast-review-grid img{display:block;width:100%;height:400px;object-fit:contain;object-position:bottom;margin-bottom:14px}.cast-review-grid h3{font-size:20px}@media(max-width:700px){.cast-review-grid{grid-template-columns:1fr}} </style></head>
<body class="pixel-app"><main class="lab-shell"><div class="eyebrow">HỒI ÂM / CHARACTER ART</div><h1>Sprite hội thoại</h1><p class="lab-note">Cảnh mock để kiểm tra art và biểu cảm. Nhân vật trên map vẫn dùng pixel.</p><a href="../pixel.html">← Vào map test</a>
<div class="lab-controls"><label>Nhân vật <select id="character"></select></label><label>Biểu cảm <select id="expression"><option value="neutral">Trung tính</option><option value="happy">Vui</option><option value="serious">Nghiêm túc / lo lắng</option></select></label><label>Nền <select id="background"><option value="map">Màu map</option><option value="light">Sáng</option><option value="dark">Tối</option></select></label><label><input type="checkbox" id="mobile"> Khung mobile 390px</label><button id="next">Người tiếp theo →</button></div>
<p id="art-status" role="status">Đang tải…</p><div class="art-preview" id="preview"><div class="dialogue-stage" id="stage"><section class="pixel-dialog" role="dialog" aria-label="Cảnh thử minh họa"><div class="pixel-dialog-head"><h2 id="speaker"></h2><button id="close">Đóng · Esc</button></div><p class="dialogue-line" id="line"></p><p class="muted">Cảnh thử · các nút dưới đây chỉ đổi biểu cảm.</p><button id="neutral">Chào hỏi</button> <button id="happy" class="primary">Chia sẻ tin vui</button> <button id="serious">Bàn chuyện khó</button></section></div></div></main><script type="module" src="dialogue-sprite-lab.js"></script></body></html>
