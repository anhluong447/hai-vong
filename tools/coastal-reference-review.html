<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="coastal-reference-review.css">
</head>
<body>
  <header class="authoring">
    <h1 data-copy="title"></h1><p data-copy="description"></p>
    <div class="controls">
      <label><span data-copy="screen"></span><select id="screen"></select></label>
      <label><span data-copy="layer"></span><select id="layer"></select></label>
      <label class="checkbox"><input id="annotations" type="checkbox" checked><span data-copy="annotations"></span></label>
      <label><span data-copy="candidate"></span><input id="candidate" type="file" accept="image/png"></label>
      <label><span data-copy="mode"></span><select id="mode"><option value="reference" data-copy="reference"></option><option value="overlay" data-copy="overlay"></option><option value="difference" data-copy="difference"></option></select></label>
      <button id="export-overlay" disabled data-copy="exportOverlay"></button>
      <button id="export-difference" disabled data-copy="exportDifference"></button>
      <button id="export-report" disabled data-copy="exportReport"></button>
    </div>
    <p id="coordinates" aria-live="off"></p><p id="status" role="status"></p>
  </header>
  <main>
    <div id="frame">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img">
        <title id="stage-title"></title>
        <image id="reference-image" width="1672" height="941"></image>
        <foreignObject width="1672" height="941"><canvas id="comparison" width="1672" height="941" hidden></canvas></foreignObject>
        <g id="marks"></g>
      </svg>
    </div>
    <aside class="authoring">
      <h2 data-copy="regionDetail"></h2><pre id="detail"></pre>
      <h2 data-copy="comparisonDetail"></h2><p data-copy="diagnostic"></p><pre id="report"></pre>
    </aside>
  </main>
  <script type="module" src="coastal-reference-review.js"></script>
</body>
</html>
